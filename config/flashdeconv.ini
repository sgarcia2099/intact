<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="FLASHDeconv" description="Ultra-fast high-quality deconvolution enables online processing of top-down MS data">
    <NODE name="1" description="Instance '1' section for 'FLASHDeconv'">
      <ITEM name="max_ms_level" value="1" type="int" description="Restrict deconvolution to MS1 spectra for intact-protein neutral mass extraction." required="false" advanced="true" />
      <NODE name="FD" description="FLASHDeconv algorithm parameters">
        <ITEM name="merging_method" value="0" type="int" description="No pre-merge by default for LC data." required="false" advanced="false" />
        <ITEM name="report_FDR" value="false" type="bool" description="Disable beta FDR reporting." required="false" advanced="false" />
      </NODE>
      <NODE name="SD" description="Spectral deconvolution parameters">
        <ITEMLIST name="tol" type="double" description="PPM tolerance for MS1, MS2, ..." required="false" advanced="false">
          <LISTITEM value="10"/>
          <LISTITEM value="10"/>
        </ITEMLIST>
        <ITEM name="min_mass" value="5000.0" type="double" description="Minimum neutral mass for intact proteins." required="false" advanced="false" />
        <ITEM name="max_mass" value="200000.0" type="double" description="Maximum neutral mass for intact proteins." required="false" advanced="false" />
        <ITEM name="min_charge" value="2" type="int" description="Minimum precursor charge state." required="false" advanced="false" />
        <ITEM name="max_charge" value="100" type="int" description="Maximum precursor charge state." required="false" advanced="false" />
        <ITEMLIST name="min_cos" type="double" description="Minimum isotope cosine similarity for MS1, MS2, ..." required="false" advanced="true">
          <LISTITEM value="0.85"/>
          <LISTITEM value="0.85"/>
        </ITEMLIST>
        <ITEMLIST name="min_snr" type="double" description="Minimum charge SNR for MS1, MS2, ..." required="false" advanced="true">
          <LISTITEM value="0.25"/>
          <LISTITEM value="0.25"/>
        </ITEMLIST>
      </NODE>
      <NODE name="ft" description="Feature tracing parameters">
        <ITEM name="quant_method" value="area" type="string" restrictions="area,median,max_height" description="Area-based quantification for LC data." required="false" advanced="true" />
        <ITEM name="min_trace_length" value="0.0" type="double" description="Allow short traces in exploratory intact protein work (seconds)." required="false" advanced="false" />
        <ITEM name="max_trace_length" value="-1.0" type="double" description="Disable maximum trace length pruning." required="false" advanced="true" />
        <ITEM name="min_sample_rate" value="0.1" type="double" description="Minimum fraction of scans with a peak along the trace." required="false" advanced="false" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
